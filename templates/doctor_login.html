{% extends "base.html" %}

{% block title %}Doctor Portal - Login{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 0 auto;">
    <div class="card">
        <h2 class="hero-title" style="font-size: 1.6rem; text-align: center; margin-bottom: 20px;">
            {{ get_text('doctor_auth_title', current_lang) }}
        </h2>

        <form method="POST" action="{{ url_for('doctor_login') }}">
            <div class="form-group">
                <label for="id_or_email">{{ get_text('lbl_doctor_id', current_lang) }}</label>
                <input type="text" id="id_or_email" name="id_or_email" class="form-control" value="doctor@kiosk.in" required>
            </div>

            <div class="form-group">
                <label for="password">{{ get_text('lbl_password', current_lang) }}</label>
                <input type="password" id="password" name="password" class="form-control" value="doctor123" required>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
                {{ get_text('btn_login', current_lang) }}
            </button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-color);">

        <div style="text-align: center; font-size: 0.9rem; color: #64748b;">
            New physician? <a href="{{ url_for('doctor_register') }}" style="color: var(--primary); font-weight: 600;">Register Account</a>
        </div>
    </div>
</div>
{% endblock %}
